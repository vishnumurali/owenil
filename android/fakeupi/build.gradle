// Test-only stand-in for a UPI app such as Google Pay. CI installs it on the
// emulator next to Owenil: it answers every upi://pay request at once with a
// SUCCESS result, so the smoke test can check Owenil's "open the UPI app, then
// read its answer" round trip. It is never published.
apply plugin: 'com.android.application'

android {
    namespace = "io.github.vishnumurali.owenil.fakeupi"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.vishnumurali.owenil.fakeupi"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}
